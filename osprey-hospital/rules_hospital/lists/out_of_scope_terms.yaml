# --- System internals ---------------------------------------------------------
# Data the agent has no business surfacing. The *override* and prompt-extraction
# attempts that used to live here have moved to injection_attempt_phrases.yaml:
# asking what model you are is a curious patient, while "ignore all the rules"
# is someone probing the controls, and only the second should page anyone.
- "admin password"
- "api key"
- "api token"
- "access token"
- "root access"
- "source code"
- "what model are you"
- "which model are you"
- "which llm"
