# Requests this agent has no business answering at all.
#
# Distinct from clinical_terms.yaml, which is about the ONE subject the agent
# must not give an opinion on. This list is the outer boundary: subjects the
# agent has no data for, no mandate over, and no reason to discuss. Revenue,
# staff pay, other patients in bulk, system internals, general chit-chat.
#
# Why a rule and not just a prompt line: the system prompt already tells the
# model to stay operational, and the README documents what happened anyway --
# asked about opening hours and parking, it called update_patient_record. A
# model that will write to a patient chart during a parking question will also
# improvise a revenue figure. The prompt is the soft boundary; this is the hard
# one, and it produces a flat "cannot be processed" that no phrasing negotiates
# its way past.
#
# The failure mode being prevented is not embarrassment, it is confabulation:
# an 8B model asked for last quarter's revenue does not say "I don't know", it
# says "approximately £2.4 million", and a plausible invented number attributed
# to the practice is worse than no answer.
#
# Matched case-insensitively as substrings against the PATIENT'S message and
# against the agent's drafted reply. Phrases are chosen to be long enough not
# to collide with ordinary scheduling talk -- "income of" rather than "income",
# because "incoming call" contains the latter. Everything in scope (booking,
# registration, contact and insurance details, opening hours, location,
# parking) is deliberately absent.

