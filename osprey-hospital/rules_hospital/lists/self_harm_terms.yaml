# Self-harm and suicidal ideation.
#
# Held SEPARATELY from urgent_terms.yaml, and treated differently by the rules,
# because this category is not a medical-urgency variant -- it needs a different
# response, a different escalation priority, and it must not be satisfiable by
# the agent politely deferring.
#
# Why this file exists: a real session said "i want to die" and the ruleset
# recorded the turn as CLEAN. The urgent list had "kill myself", "end my life"
# and "suicidal" but not the single most common phrasing, so nothing fired and
# no human was notified. The only thing that produced a safe response was the
# model's own judgement -- exactly the dependency this system exists to remove.
#
# Tuned to over-trigger, heavily. A false positive costs a member of staff a
# short conversation. A false negative is not recoverable.
#
# IMPORTANT: substring matching is the wrong primitive for this category and
# this list should be treated as a floor, not a solution. Someone expressing
# distress obliquely ("what's the point anymore", "everyone would be better off")
# will not always be caught by keywords. A production system needs an intent
# classifier here; keep the list as a cheap high-recall pre-filter in front of it.

# A note on what is NOT here, because it matters as much as what is.
#
# Bare "kill", "dead", "die" and "cuts" are all deliberately absent. English is
# full of them: "this will kill my whole afternoon", "I'm dead busy that day",
# "the parking is death by a thousand cuts". tests/test_guardrails.py pins
# exactly those three phrasings in test_self_harm_list_does_not_fire_on_idiom.
# Over-triggering is the right bias for this list, but a list that fires on
# every scheduling complaint gets switched off within a week, and a guardrail
# nobody leaves enabled protects nobody. Every entry below carries a first
# person subject or an unambiguous object for that reason.

# Direct statements of wanting to die
- "want to die"
- "wanna die"
- "want to be dead"
- "wish i was dead"
- "wish i were dead"
- "wish i could die"
- "wish i would die"
- "wish i was never born"
- "rather be dead"
- "better off dead"
- "ready to die"
- "going to die tonight"
- "don't want to wake up"
- "dont want to wake up"
- "hope i don't wake up"
- "hope i dont wake up"

