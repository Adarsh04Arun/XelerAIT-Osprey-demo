- "take two"
- "take 2"
- "take one"
- "take a couple of"
- "twice a day"
- "three times a day"
- "every four hours"
- "every 4 hours"
- "every six hours"
- "every 6 hours"
- "every eight hours"
- "with food"
- "on an empty stomach"
- "mg of"
- "milligrams"
- "dosage"
- "dose of"
- "double the dose"
- "stop taking"
- "keep taking"
- "increase your"
- "reduce your"

