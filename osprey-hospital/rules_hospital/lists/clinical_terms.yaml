- "you likely have"
- "you probably have"
- "it sounds like you have"
- "that sounds like"
- "this is likely"
- "you might have"
- "you may have"
- "diagnosis"
- "diagnosed with"
- "suffering from"
- "symptoms suggest"
- "symptoms indicate"
- "consistent with"
- "indicative of"
- "typical of"
- "classic sign"
- "a sign of"
- "could be caused by"
